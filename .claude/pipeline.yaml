# The write table (AH-13: single copy). writable mirrors CLAUDE.md "Read / write policy": aegis/runs/**,
# ../tests/** limited to tests/qa/** by HANDBOOK/17, aegis/packages/@qa/**, aegis/apps/**, aegis/agent-memory/**, aegis/sandbox/** (gitignored scratch for sandbox-first exploration).
writePolicy:
  writable: ["{run}/**", "runs/**", "{tests}/qa/**", "packages/@qa/**", "apps/**", "agent-memory/**", "sandbox/**"]
  # Internal (_qa-*) skills maintain the framework itself.
  internalSkills: [".claude/**", "HANDBOOK/**", "docs/**"]
  # Named exceptions: _qa-build-toc regenerates the HANDBOOK.md table of contents.
  # AUD-112: HANDBOOK/17 rule (b) keeps the qa-e2e project in the target's own Playwright config;
  # /qa-ci-bootstrap writes only the QA-owned qa-*.yml workflow files of the target.
  units:
    _qa-build-toc: [HANDBOOK.md]
    qa-environment-engineer: ["{target}/playwright.config.ts"]
    qa-ci-bootstrap: ["{target}/.github/workflows/qa-*.yml"]
