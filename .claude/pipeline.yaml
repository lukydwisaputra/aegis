pipeline: 1
phases:
  - id: intake
    agents: []
  - id: scan
    agents: [qa-context-scanner]
  - id: dev-test-review
    agents: [qa-dev-test-reviewer]
  - id: requirements
    agents: [qa-requirements-analyst]
  - id: env-auth  # qa-environment-engineer scope=auth; also listed under env-data, its contract phase (HANDBOOK 14.11)
    agents: [qa-environment-engineer]
  - id: explore
    agents: [qa-web-explorer, qa-exploratory-specialist]
  - id: planning
    agents: [qa-test-planner]
    gateAfter: G1
  - id: design
    agents: [qa-test-designer]
  - id: env-data
    agents: [qa-environment-engineer]
  - id: execution
    agents: [qa-test-executor]
  - id: triage
    agents: [qa-defect-manager]
    gateAfter: G2
  - id: closure-draft
    agents: [qa-closure-reporter]
  - id: compliance  # qa-compliance-* are crosscutting; the orchestrator places them "during Compliance"
    agents: []
  - id: closure-final  # qa-closure-reporter final pass: listed once, under closure-draft
    agents: []
    gateAfter: G3
  - id: executive
    agents: [qa-executive-reporter]
  - id: curator  # qa-curator is crosscutting; placed "during Curator"
    agents: []
routing:
  byType:
    Functional: qa-ui-specialist
    UI: qa-ui-specialist
    E2E: qa-ui-specialist
    API: qa-api-specialist
    Integration: qa-api-specialist
    Performance: qa-performance-specialist
    Security: qa-security-specialist
    Database: qa-database-specialist
    Compatibility: qa-responsive-specialist
    Usability: qa-exploratory-specialist
  byTechnique:
    Unit: qa-unit-specialist
    Accessibility: qa-accessibility-specialist
    Email: qa-email-specialist
    Realtime: qa-realtime-specialist
    FeatureFlag: qa-feature-flag-specialist
    Exploratory: qa-exploratory-specialist
  designerEmits:
    testType: [Functional, UI, E2E, API, Integration, Performance, Security, Database, Compatibility, Usability]
    testTechnique: [Unit, Accessibility, Email, Realtime, FeatureFlag, Exploratory, BoundaryValue, EquivalencePartition, StateTransition, DecisionTable, Pairwise, Regression, Smoke, Flow, Visual, Contract, Load, Migration]
  techniqueWithoutSpecialist: [BoundaryValue, EquivalencePartition, StateTransition, DecisionTable, Pairwise, Regression, Smoke, Flow, Visual, Contract, Load, Migration]
spvPairs:
  qa-cicd-planner: qa-cicd-spv
  qa-cicd-implementer: qa-cicd-spv
  qa-cicd-evaluator: qa-cicd-spv
  qa-github-planner: qa-github-spv
  qa-github-implementer: qa-github-spv
envSpecialists:
  ui: qa-ui-specialist
  api: qa-api-specialist
  security: qa-security-specialist
  database: qa-database-specialist
  performance: qa-performance-specialist
  responsive: qa-responsive-specialist
  exploratory: qa-exploratory-specialist
  accessibility: qa-accessibility-specialist
  email: qa-email-specialist
  realtime: qa-realtime-specialist
  feature-flag: qa-feature-flag-specialist
  unit: qa-unit-specialist
sources:
  cli:
    - "{run}/run.json"
    - "{run}/events.jsonl"
    - "{run}/taskmaster/**"
    - "{run}/reports/work/**"
    - "{run}/reports/review/**"
    - "{run}/gates/**"
    - "{run}/intake/**"
    - "{run}/integrity/**"
  owner: []
  target:
    - "{target}/**"
  repo:
    - aegis.config.json
    - thresholds.yaml
    - "knowledge/**"
    - "agent-memory/**"
    - ".claude/**"
    - module-codes.md
    - "test-data/**"
    - "secrets/**"
    - "apps/dashboard/**"
nonAgentNames:
  - qa-e2e # Playwright project name (qa-environment-engineer.md:61, HANDBOOK/17:76)
  - qa-automated # GitHub label (qa-github-planner.md:40)
  - qa-build-toc # pnpm script in package.json (CLAUDE.md:36 `pnpm qa-build-toc`), not the _qa-build-toc skill
  - qa-results # CI artifact name prefix (docs/D12-cicd-workflow.md:64 `qa-results-${{ github.run_id }}`)
  - qa-api # CI job name in a workflow example (docs/D12-monorepo-multi-app.md:167)
  - qa-web # CI job name in a workflow example (docs/D12-monorepo-multi-app.md:171)
  - qa-admin # CI job name in a workflow example (docs/D12-monorepo-multi-app.md:176)
# pnpm scripts/bins run in the target repo by generated setup, not Aegis scripts
externalScripts: [husky]
